name: Update trends data (weekly)

on:
  schedule:
    # Runs every Monday at 06:00 UTC. Adjust the cron expression to change timing.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}  # allows manually triggering a run from the Actions tab

permissions:
  contents: write  # needed so the workflow can commit the updated CSVs/JSON back to the repo

jobs:
  update-trends:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run data collection script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRENDS_MCP_API_KEY: ${{ secrets.TRENDS_MCP_API_KEY }}
        run: python scripts/fetch_trends.py

      - name: Recompute momentum leaderboard
        run: python scripts/compute_momentum.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/counts_trends.csv data/interest_trends.csv data/momentum.json data/momentum_history.json data/status.json
          git diff --quiet --cached || git commit -m "Weekly trends update: $(date -u +'%Y-%m-%d')"
          git push
